# 명령줄로 배포할 때만 씁니다 (대시보드에 worker.js 를 붙여 넣는 방법이면 필요 없음).
#   npx wrangler login
#   npx wrangler deploy --config cms-auth/wrangler.toml
#   npx wrangler secret put GITHUB_CLIENT_SECRET --config cms-auth/wrangler.toml
name = "lead-ai-lab-cms-auth"
main = "worker.js"
compatibility_date = "2026-10-01"

