# 대시보드에서 바꾼 값이 있으면 명령줄 배포가 이 값으로 덮어쓰니, 두 곳을 같게 유지하세요.
GITHUB_CLIENT_ID = "Iv23lipHaxk3hV4jTvY8"
ALLOWED_RETURN_URLS = "https://smu-edtech-lab.github.io/lead-ai-lab/admin,http://localhost:3000/admin"
