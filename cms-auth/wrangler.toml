# 명령줄로 배포할 때만 씁니다 (대시보드에 worker.js 를 붙여 넣는 방법이면 필요 없음).
#   npx wrangler login
#   npx wrangler deploy --config cms-auth/wrangler.toml
#   npx wrangler secret put GITHUB_CLIENT_SECRET --config cms-auth/wrangler.toml
name = "lead-ai-lab-cms-auth"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# GitHub App 의 Client ID 와 관리자 화면 주소로 바꿔 주세요 (설정 안내서 2·3단계)
GITHUB_CLIENT_ID = ""
ALLOWED_RETURN_URLS = "https://smu-edtech-lab.github.io/lead-ai-lab/admin,http://localhost:3000/admin"
