  --border-hair: 1px;

  --bp-sm: 480px;
  --bp-md: 768px;
  --bp-lg: 1024px;

  --container-max: 1600px;

  --dur-instant: 100ms;

/* Learning Lab — component styles. Loaded after tokens.css; every colour, space, radius and motion value is a token var().
   Layout-only responsive values (fluid type, margins) live here because tokens.json holds fixed sizes. */

/* ---------- Fluid scale & layout variables ---------- */
:root {
  --lab-margin: 20px; --lab-gutter: 16px; --lab-header-h: 64px;
  --lab-sec-y: clamp(96px, 11vw, 176px);
  --lab-fs-dxl: clamp(52px, 9.6vw, 176px);
  --lab-fs-dl: clamp(48px, 8.4vw, 128px);
  --lab-fs-dm: clamp(40px, 6vw, 88px);
  --lab-fs-h1: clamp(36px, 4.4vw, 64px);
  --lab-fs-h2: clamp(30px, 3.4vw, 48px);
  --lab-fs-h3: clamp(26px, 2.6vw, 36px);
  --lab-fs-h4: clamp(22px, 2vw, 28px);
  --lab-fs-h5: clamp(19px, 1.6vw, 22px);
  --lab-fs-kol: clamp(26px, 2.8vw, 40px);
  --lab-fs-ko: clamp(20px, 1.9vw, 26px);
  --lab-fs-lead: clamp(17px, 1.45vw, 20px);
  --lab-fs-navl: clamp(36px, 9vw, 64px);
}
@media (min-width: 768px) { :root { --lab-margin: 32px; --lab-gutter: 20px; } }
@media (min-width: 1024px) { :root { --lab-margin: var(--page-margin, 48px); --lab-gutter: var(--grid-gutter, 24px); --lab-header-h: var(--header-h, 72px); } }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--lab-header-h) + 16px); }
body { margin: 0; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; word-break: keep-all; overflow-wrap: break-word; }
h1, h2, h3, h4, h5, h6, p, figure, dl, dd, blockquote { margin: 0; }
img, svg, video, canvas { display: block; max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--navy-900); color: var(--white); }
:focus-visible { outline: var(--border-strong-w, 2px) solid var(--focus-ring); outline-offset: 3px; }
.lab-sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.lab-skip { position: fixed; left: 12px; top: 12px; z-index: var(--z-cursor); padding: 12px 18px; background: var(--btn-primary-bg); color: var(--btn-primary-fg); font: 500 15px/1 var(--font-display); text-decoration: none; transform: translateY(-200%); transition: transform var(--dur-fast) var(--ease-standard); }
.lab-skip:focus { transform: none; }
.lab-viewport { position: relative; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; background: var(--bg-page); scrollbar-width: thin; }
.lab-site, .lab-main { position: relative; }
.lab-main:focus { outline: none; }

/* ---------- Grid ---------- */
.lab-container { width: 100%; max-width: var(--container-max); margin-inline: auto; padding-inline: var(--lab-margin); }

.lab-sec { position: relative; padding-block: var(--lab-sec-y); }
.lab-sec--subtle { background: var(--bg-subtle); }

/* ---------- Type (fluid; maxima = tokens.json) ---------- */

.lab-t-h3 { font-size: var(--lab-fs-h3); line-height: 1.12; letter-spacing: -.025em; }

.lab-t-title-ko { font-family: var(--font-sans); font-size: var(--lab-fs-ko); line-height: 1.42; letter-spacing: -.025em; font-weight: 600; }
.lab-t-lead { font-family: var(--font-sans); font-size: var(--lab-fs-lead); line-height: 1.7; letter-spacing: -.015em; color: var(--text-secondary); max-width: 36em; }
.lab-t-body-l { font-family: var(--font-sans); font-size: 18px; line-height: 1.75; letter-spacing: -.01em; max-width: 40em; }
.lab-t-body { font-family: var(--font-sans); font-size: 16px; line-height: 1.7; letter-spacing: -.005em; max-width: 38em; }
.lab-t-body-s { font-family: var(--font-sans); font-size: 14px; line-height: 1.6; }
.lab-t-caption { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--text-tertiary); }

.lab-t-index { font-size: 13px; line-height: 1.2; letter-spacing: .02em; font-variant-numeric: tabular-nums; }

h1, h2, h3, .lab-t-h1, .lab-t-h2, .lab-t-h3, .lab-t-title-ko, .lab-t-title-ko-l { text-wrap: balance; }
p { text-wrap: pretty; }

/* ---------- Split text masks ---------- */
.lab-split { display: block; }
.lab-split__vis { display: block; }
.lab-line { display: block; overflow: hidden; padding: .12em 0 .1em; margin: -.12em 0 -.1em; }
.lab-line-inner { display: inline-block; will-change: transform; }

/* ---------- Text roll ---------- */

  a:hover .lab-roll__a, button:hover .lab-roll__a, a:hover .lab-roll__b, button:hover .lab-roll__b { transform: translateY(-100%); }
}
a:focus-visible .lab-roll__a, a:focus-visible .lab-roll__b, button:focus-visible .lab-roll__a, button:focus-visible .lab-roll__b { transform: translateY(-100%); }

/* ---------- Buttons ---------- */
.lab-btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  height: 48px; padding: 0 22px 0 26px; border: 1px solid transparent; border-radius: var(--radius-pill);
  font: 500 15px/1 var(--font-display); letter-spacing: -.005em; text-decoration: none; white-space: nowrap; cursor: pointer; user-select: none;
  -webkit-tap-highlight-color: transparent; transition: color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard), scale var(--dur-instant) var(--ease-standard), opacity var(--dur-fast); }

.lab-btn--l { height: 56px; padding: 0 26px 0 30px; font-size: 16px; }

  transform: translate(-50%, -50%) scale(0); transition: transform var(--dur-slow) var(--ease-out); pointer-events: none; }

.lab-btn__icon-b { transform: translateX(-130%); }
.lab-btn:active { scale: .97; }
.lab-btn--primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); }

.lab-btn--secondary { background: transparent; color: var(--btn-secondary-fg); border-color: var(--btn-secondary-border); }
.lab-btn--secondary .lab-btn__wipe { background: var(--btn-secondary-wipe); }
.lab-btn--ghost { background: transparent; color: var(--text-primary); padding-inline: 14px; }
.lab-btn--ghost .lab-btn__wipe { background: var(--bg-selected); }
.lab-btn--on-brand { background: var(--white); color: var(--navy-900); }
.lab-btn--on-brand .lab-btn__wipe { background: var(--silver-200); }
.lab-btn--on-brand:focus-visible { outline-color: var(--focus-ring-on-brand); }
@media (hover: hover) and (pointer: fine) {
  .lab-btn:hover .lab-btn__wipe { transform: translate(-50%, -50%) scale(1); }
  .lab-btn--secondary:hover { color: var(--btn-secondary-fg-hover); border-color: var(--btn-secondary-wipe); }
  .lab-btn:hover .lab-btn__icon-a { transform: translateX(130%); }

}
.lab-btn[aria-disabled="true"], .lab-btn:disabled { opacity: .38; cursor: not-allowed; }

.lab-btn.is-loading { cursor: progress; }
.lab-btn.is-loading .lab-btn__icon { display: none; }
.lab-btn__spinner { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: lab-spin 800ms linear infinite; }
@keyframes lab-spin { to { transform: rotate(360deg); } }
.lab-magnetic { will-change: transform; }
.lab-magnetic::after { content: ""; position: absolute; inset: -14px; border-radius: inherit; }
.lab-btn__clip { position: absolute; inset: -1px; z-index: -1; overflow: hidden; border-radius: inherit; pointer-events: none; }

/* Icon button */
.lab-iconbtn { position: relative; isolation: isolate; display: inline-grid; place-items: center; flex: none; width: 48px; height: 48px; padding: 0;
  border-radius: var(--radius-circle); border: 1px solid transparent; background: transparent; color: var(--text-primary); cursor: pointer; text-decoration: none;
  transition: color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast), scale var(--dur-instant); -webkit-tap-highlight-color: transparent; }
.lab-iconbtn--s { width: 40px; height: 40px; }

.lab-iconbtn__inner { display: grid; place-items: center; }
.lab-iconbtn--outline { border-color: var(--border-control); }

@media (hover: hover) and (pointer: fine) {
  .lab-iconbtn:hover .lab-btn__wipe { transform: translate(-50%, -50%) scale(1); }
  .lab-iconbtn--outline:hover { color: var(--btn-secondary-fg-hover); border-color: var(--btn-secondary-wipe); }
  .lab-iconbtn--on-brand:hover { color: var(--navy-900); border-color: var(--white); }
}

/* ---------- Links ---------- */
.lab-link { position: relative; display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; }
.lab-link__text { background: linear-gradient(currentColor, currentColor) no-repeat right bottom / 100% 1px; padding-bottom: 2px; }
.lab-link--standalone { font: 500 15px/1.3 var(--font-display); }
.lab-link--standalone .lab-link__text { background-size: 0% 1px; transition: background-size var(--dur-slow) var(--ease-in-out); }
.lab-link__arrow, .lab-link__ext { display: inline-flex; transition: transform var(--dur-base) var(--ease-out); }
.lab-link--on-brand { color: var(--text-on-brand); }
.lab-link--on-brand:focus-visible { outline-color: var(--focus-ring-on-brand); }
@keyframes lab-uline-redraw { 0% { background-size: 100% 1px; background-position: right bottom; } 45% { background-size: 0% 1px; background-position: right bottom; } 46% { background-size: 0% 1px; background-position: left bottom; } 100% { background-size: 100% 1px; background-position: left bottom; } }
@media (hover: hover) and (pointer: fine) {
  .lab-link--inline:hover .lab-link__text { animation: lab-uline-redraw var(--dur-slower) var(--ease-in-out) both; }
  .lab-link--standalone:hover .lab-link__text { background-size: 100% 1px; background-position: left bottom; }
  .lab-link:hover .lab-link__arrow { transform: translateX(4px); }
  .lab-link:hover .lab-link__ext { transform: translate(2px, -2px); }
}
.lab-link--standalone:focus-visible .lab-link__text { background-size: 100% 1px; background-position: left bottom; }
.lab-uline { background: linear-gradient(currentColor, currentColor) no-repeat right bottom / 0% 1px; transition: background-size var(--dur-slow) var(--ease-in-out); padding-bottom: 2px; }
@media (hover: hover) and (pointer: fine) { a:hover .lab-uline { background-size: 100% 1px; background-position: left bottom; } }
a:focus-visible .lab-uline { background-size: 100% 1px; background-position: left bottom; }

/* ---------- Tags, status, plus, collapse, mark, roller ---------- */
.lab-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: 1px solid var(--border-hairline); border-radius: var(--radius-pill);
  font: 500 12px/1 var(--font-display); letter-spacing: .02em; color: var(--text-secondary); white-space: nowrap; }
.lab-status { display: inline-flex; align-items: center; gap: 8px; font: 600 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--text-secondary); }
.lab-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); }
.lab-status.is-live::before { background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: lab-pulse 2.4s var(--ease-out) infinite; }
@keyframes lab-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent); } }
.lab-plus { position: relative; display: inline-block; width: 14px; height: 14px; flex: none; }
.lab-plus::before, .lab-plus::after { content: ""; position: absolute; left: 0; top: 50%; width: 14px; height: 1.5px; margin-top: -.75px; background: currentColor; transition: transform var(--dur-base) var(--ease-in-out); }
.lab-plus::after { transform: rotate(90deg); }
[aria-expanded="true"] .lab-plus::after { transform: rotate(0deg); }
[aria-expanded="true"] .lab-plus::before { transform: rotate(180deg); }
.lab-collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-base) var(--ease-in-out); }
.lab-collapse[data-open="true"] { grid-template-rows: 1fr; }
.lab-collapse__in { min-height: 0; overflow: hidden; }
.lab-collapse[data-open="false"] .lab-collapse__in { visibility: hidden; transition: visibility 0s var(--dur-base); }
.lab-mark { background: var(--bg-selected); color: inherit; box-shadow: inset 0 -2px 0 var(--accent); padding: 0 1px; }
.lab-roller { display: inline-flex; font-variant-numeric: tabular-nums; line-height: 1; }
.lab-roller__col { display: inline-block; height: 1em; overflow: hidden; line-height: 1; }
.lab-roller__strip { display: flex; flex-direction: column; transition: transform var(--dur-slow) var(--ease-out); }
.lab-roller__strip > span { display: block; height: 1em; line-height: 1; }
.lab-roller__sep { display: inline-block; }

/* ---------- Header ---------- */
.lab-header { position: sticky; top: 0; z-index: var(--z-header); height: var(--lab-header-h); color: var(--text-primary); border-bottom: 1px solid transparent;
  transition: transform var(--dur-slow) var(--ease-in-out), background-color var(--dur-base) var(--ease-standard), border-color var(--dur-base), color var(--dur-base); }
.lab-header.is-scrolled { background: var(--header-bg-scrolled); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom-color: var(--border-hairline); }
.lab-header.is-hidden { transform: translate3d(0, -100%, 0); }
.lab-header.is-on-brand { color: var(--text-on-brand); }
.lab-header__bar { height: 100%; max-width: var(--container-max); margin-inline: auto; padding-inline: var(--lab-margin); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.lab-brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
.lab-brand__text { display: flex; flex-direction: column; gap: 3px; }
.lab-brand__name { font: 600 17px/1 var(--font-display); letter-spacing: -.02em; }
.lab-brand__sub { font: 500 10px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--text-tertiary); }
.lab-header__nav { position: relative; display: none; }
.lab-nav { display: flex; gap: clamp(18px, 2.3vw, 40px); list-style: none; margin: 0; padding: 0; }
.lab-nav__item { position: relative; display: flex; align-items: center; gap: 2px; }
.lab-nav__link { display: inline-flex; align-items: flex-start; gap: 5px; padding: 26px 0; font: 500 15px/1 var(--font-display); letter-spacing: -.005em; color: inherit; text-decoration: none; }
.lab-nav__num { font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text-tertiary); transition: color var(--dur-fast); }
.lab-nav__link[aria-current="page"] .lab-nav__num { color: var(--accent); }
.lab-nav__toggle { display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; background: none; color: var(--icon); cursor: pointer; border-radius: var(--radius-circle); transition: transform var(--dur-base) var(--ease-in-out), color var(--dur-fast); }
.lab-nav__toggle[aria-expanded="true"] { transform: rotate(180deg); color: var(--accent); }
.lab-nav__indicator { position: absolute; left: 0; bottom: 17px; width: 0; height: 2px; background: var(--nav-indicator); pointer-events: none; opacity: 0;
  transition: transform var(--dur-base) var(--ease-out), width var(--dur-base) var(--ease-out), opacity var(--dur-fast); }
.lab-header__actions { display: flex; align-items: center; gap: 8px; }
.lab-header__search { display: none; }
.lab-menubtn { display: inline-flex; align-items: center; gap: 12px; height: 44px; padding: 0 2px 0 8px; border: 0; background: none; cursor: pointer; color: inherit; font: 500 14px/1 var(--font-display); }
.lab-menubtn__lines { position: relative; width: 24px; height: 12px; }
.lab-menubtn__lines span { position: absolute; left: 0; width: 24px; height: 1.5px; background: currentColor; transition: transform var(--dur-base) var(--ease-in-out), top var(--dur-base) var(--ease-in-out); }
.lab-menubtn__lines span:first-child { top: 0; } .lab-menubtn__lines span:last-child { top: 10.5px; }
.lab-menubtn.is-open .lab-menubtn__lines span:first-child { top: 5.25px; transform: rotate(45deg); }
.lab-menubtn.is-open .lab-menubtn__lines span:last-child { top: 5.25px; transform: rotate(-45deg); }
.lab-header__progress { position: absolute; left: 0; right: 0; bottom: -1px; }
@media (min-width: 1024px) {
  .lab-header__nav { display: block; }
  .lab-header__search { display: inline-grid; }
  .lab-menubtn { display: none; }
}
.lab-progress { height: 2px; overflow: hidden; pointer-events: none; }
.lab-progress__bar { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
/* dropdown */
.lab-dd { position: absolute; top: calc(100% - 10px); left: -20px; min-width: 300px; padding: 8px; background: var(--bg-page); border: 1px solid var(--border-hairline); box-shadow: var(--shadow-float); z-index: 2; }
.lab-dd.is-open { animation: lab-dd-in var(--dur-base) var(--ease-out) both; }
@keyframes lab-dd-in { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.lab-dd__list { list-style: none; margin: 0; padding: 0; }
.lab-dd__item { display: grid; grid-template-columns: 28px 1fr 20px; align-items: center; gap: 8px; padding: 12px 12px; color: var(--text-primary); text-decoration: none; transition: background-color var(--dur-fast); }
.lab-dd__idx { font: 500 11px/1 var(--font-display); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.lab-dd__text { display: flex; flex-direction: column; gap: 4px; }
.lab-dd__label { font: 500 15px/1.2 var(--font-display); }
.lab-dd__ko { font-size: 13px; line-height: 1.3; color: var(--text-tertiary); }
.lab-dd__arrow { color: var(--icon); opacity: 0; transform: translateX(-6px); transition: transform var(--dur-base) var(--ease-out), opacity var(--dur-fast); }
.lab-dd__item:hover, .lab-dd__item:focus-visible { background: var(--bg-selected); }
.lab-dd__item:hover .lab-dd__arrow, .lab-dd__item:focus-visible .lab-dd__arrow { opacity: 1; transform: none; }
.lab-dd__item:focus-visible { outline-offset: -2px; }

/* ---------- Mobile menu ---------- */
.lab-mmenu { position: fixed; inset: 0; z-index: var(--z-overlay); }
.lab-mmenu__panel { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 24px; padding: 12px var(--lab-margin) 32px; overflow-y: auto; background: var(--bg-brand); color: var(--text-on-brand); }
.lab-mmenu__top { display: flex; align-items: center; justify-content: space-between; height: calc(var(--lab-header-h) - 12px); }
.lab-mmenu__eyebrow { font: 600 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--text-on-brand-subtle); }
.lab-mmenu__list { list-style: none; margin: auto 0 0; padding: 0; border-top: 1px solid var(--border-on-brand); }
.lab-mmenu__link { display: flex; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border-on-brand); color: inherit; text-decoration: none;
  font: 500 var(--lab-fs-navl)/1.05 var(--font-display); letter-spacing: -.03em; }
.lab-mmenu__num { font-size: 13px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--text-on-brand-subtle); min-width: 22px; }
.lab-mmenu__link[aria-current="page"] .lab-mmenu__num { color: var(--text-on-brand); }
.lab-mmenu__link[aria-current="page"] .lab-mmenu__label::after { content: ""; display: inline-block; width: .18em; height: .18em; margin-left: .2em; background: currentColor; vertical-align: .55em; }
.lab-mmenu__link:focus-visible { outline-color: var(--focus-ring-on-brand); outline-offset: -2px; }
.lab-mmenu__foot { font-size: 14px; color: var(--text-on-brand-muted); }

/* ---------- Page curtain ---------- */
.lab-curtain { position: fixed; inset: 0; z-index: var(--z-transition); display: flex; align-items: flex-end; visibility: hidden; transform: translate3d(0, 100%, 0);
  background: var(--bg-brand); color: var(--text-on-brand); pointer-events: none; }
.lab-curtain__inner { width: 100%; max-width: var(--container-max); margin-inline: auto; padding: var(--lab-margin) var(--lab-margin) 9vh; display: flex; flex-direction: column; gap: 16px; }
.lab-curtain__eyebrow { font: 600 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--text-on-brand-muted); }
.lab-curtain__mask { display: block; overflow: hidden; padding: .12em 0 .1em; margin: -.12em 0 -.1em; }
.lab-curtain__title { display: block; font: 500 var(--lab-fs-dl)/.9 var(--font-display); letter-spacing: -.05em; transform: translate3d(0, 120%, 0); }

/* ---------- Media ---------- */
.lab-media { position: relative; display: block; width: 100%; margin: 0; }
.lab-media__frame { position: relative; overflow: hidden; background: var(--bg-muted); }
.lab-media__px { position: absolute; inset: 0; }

.lab-media__img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; transition: transform var(--dur-slower) var(--ease-out), opacity var(--dur-slow) var(--ease-standard); }

/* ---------- Hero ---------- */

}
@keyframes lab-cue { 0% { transform: scaleY(0); transform-origin: top; } 45% { transform: scaleY(1); transform-origin: top; } 55% { transform: scaleY(1); transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

/* ---------- Page hero ---------- */
.lab-phero { padding-top: clamp(56px, 9vw, 144px); padding-bottom: clamp(40px, 6vw, 96px); }
.lab-phero__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--lab-gutter); row-gap: 28px; }

/* ---------- Section header ---------- */
.lab-sh { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--lab-gutter); row-gap: 20px; padding-top: 24px; margin-bottom: clamp(48px, 6vw, 96px); }

/* ---------- Scroll text, marquee ---------- */

.lab-marquee__item { display: inline-flex; align-items: center; gap: clamp(20px, 2.6vw, 44px); padding-right: clamp(20px, 2.6vw, 44px); font: 500 var(--lab-fs-h2)/1 var(--font-display); letter-spacing: -.03em; }

/* ---------- Full-bleed section ---------- */

/* ---------- Research index ---------- */
.lab-rindex { position: relative; --mx: -999px; --my: -999px; }
.lab-rindex::before { content: ""; position: absolute; inset: -40px calc(-1 * var(--lab-margin)); pointer-events: none; opacity: 0; transition: opacity var(--dur-slow) var(--ease-standard);
  background: radial-gradient(520px circle at calc(var(--mx) + var(--lab-margin)) calc(var(--my) + 40px), var(--spotlight), transparent 70%); }

  transition: opacity var(--dur-base) var(--ease-standard); }

}

/* ---------- Research card (animated border) ---------- */
.lab-rcard { position: relative; display: flex; flex-direction: column; gap: 14px; min-height: 340px; padding: 28px; color: inherit; text-decoration: none; background: var(--bg-page); }

.lab-rcard:hover .lab-rcard__frame i:nth-child(3) { transition-delay: 120ms; } .lab-rcard:hover .lab-rcard__frame i:nth-child(4) { transition-delay: 180ms; }

  .lab-rcard:hover .lab-rcard__kw { opacity: 1; transform: none; }

}

/* ---------- Research explorer (sticky) ---------- */

.lab-rx__btn { width: 100%; display: flex; gap: 16px; align-items: baseline; padding: 10px 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text-tertiary); font: 500 18px/1.2 var(--font-display); letter-spacing: -.01em; transition: color var(--dur-base); }
.lab-rx__ii.is-current .lab-rx__btn, .lab-rx__btn:hover { color: var(--text-primary); }

  transition: opacity var(--dur-base) var(--ease-standard), transform var(--dur-slow) var(--ease-out), visibility 0s var(--dur-base); }

/* ---------- Projects ---------- */

.lab-project__link { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--lab-gutter); row-gap: 24px; color: inherit; text-decoration: none; }

}

/* ---------- Members ---------- */

@media (min-width: 1024px) { .lab-members { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.lab-member__hit { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; -webkit-tap-highlight-color: transparent; }
.lab-member__hit:focus-visible { outline-offset: 4px; }

.lab-member__panel { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 20px;
  background: var(--bg-brand); color: var(--text-on-brand); transform: translate3d(0, 101%, 0); }

@media (hover: hover) and (pointer: fine) { .lab-member__hit:hover .lab-media__img { transform: scale(1.04); } }
@media (hover: none), (pointer: coarse) { .lab-member__panel { display: none; } .lab-member__touch { display: block; } }

/* ---------- Publications ---------- */
.lab-pubs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
.lab-pubs__sticky { display: flex; flex-direction: column; gap: 20px; }

@media (min-width: 1024px) {

.lab-footer__ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
.lab-footer__nav, .lab-footer__info { grid-column: span 2; display: flex; flex-direction: column; gap: 16px; }
.lab-footer__nav .lab-t-label, .lab-footer__info .lab-t-label { color: var(--text-on-brand-subtle); }
.lab-footer__nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lab-footer__link { display: inline-flex; align-items: baseline; gap: 10px; color: var(--text-on-brand); text-decoration: none; font: 500 16px/1.2 var(--font-display); }
.lab-footer__link .lab-t-index { font-size: 11px; color: var(--text-on-brand-subtle); }
.lab-footer__info address, .lab-footer__info p { font-style: normal; color: var(--text-on-brand-muted); }
.lab-footer__base { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; border-top: 1px solid var(--border-on-brand); padding-right: 72px; }
.lab-footer__base .lab-t-caption { color: var(--text-on-brand-subtle); }
@media (min-width: 1024px) {
  .lab-footer__grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .lab-footer__cta { grid-column: 1 / 8; }
  .lab-footer__nav { grid-column: 9 / 11; }
  .lab-footer__info { grid-column: 11 / 13; }
}

/* ---------- Page layouts ---------- */
.lab-vision { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--lab-gutter); row-gap: 32px; }
.lab-vision__meta { grid-column: 1 / -1; display: flex; gap: 16px; color: var(--text-tertiary); }
.lab-vision__meta .lab-t-index { color: var(--accent); }
.lab-vision__text { grid-column: 1 / -1; }
.lab-vision__side { grid-column: 1 / -1; }
.lab-vision__side .lab-reveal { display: flex; flex-direction: column; gap: 18px; }
.lab-vision__side .lab-t-body { color: var(--text-secondary); }
@media (min-width: 1024px) {
  .lab-vision { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .lab-vision__meta { grid-column: 1 / 3; }
  .lab-vision__text { grid-column: 3 / 12; }
  .lab-vision__side { grid-column: 7 / 12; margin-top: 40px; }
}
.lab-twocol { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
.lab-twocol__sticky { display: flex; flex-direction: column; gap: 14px; }
.lab-twocol__sticky .lab-t-index { color: var(--accent); }
.lab-twocol__sticky .lab-t-title-ko { color: var(--text-secondary); }
.lab-twocol__flow { display: flex; flex-direction: column; gap: 56px; }
@media (min-width: 1024px) {
  .lab-twocol { grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--lab-gutter); }
  .lab-twocol__sticky { grid-column: 1 / 5; position: sticky; top: calc(var(--lab-header-h) + 32px); align-self: start; }
  .lab-twocol__flow { grid-column: 6 / 13; }
}
.lab-about-img { padding-inline: 0; }
.lab-prof { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
.lab-prof__body { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.lab-prof__body .lab-t-label { color: var(--text-tertiary); }
.lab-prof__body .lab-t-title-ko { color: var(--text-secondary); }
@media (min-width: 1024px) { .lab-prof { grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--lab-gutter); } .lab-prof__img { grid-column: 1 / 6; } .lab-prof__body { grid-column: 7 / 12; align-self: end; } }
.lab-contact { display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px; }
.lab-contact__info { display: flex; flex-direction: column; gap: 32px; }
.lab-contact__dl { display: flex; flex-direction: column; gap: 24px; }
.lab-contact__dl dt { color: var(--text-tertiary); margin-bottom: 8px; }
.lab-contact__form { display: flex; flex-direction: column; gap: 12px; }
.lab-contact__note { color: var(--text-secondary); margin-bottom: 20px; }
@media (min-width: 1024px) { .lab-contact { grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--lab-gutter); } .lab-contact__info { grid-column: 1 / 5; } .lab-contact__form { grid-column: 6 / 13; } }

/* ---------- Grid overlay & motion curves ---------- */
.lab-gridov { position: fixed; inset: 0; z-index: var(--z-cursor); pointer-events: none; }
.lab-gridov--inline { position: absolute; }
.lab-gridov__in { height: 100%; }
.lab-gridov__in span { position: relative; background: color-mix(in srgb, var(--bluegray-500) 10%, transparent); border-inline: 1px solid color-mix(in srgb, var(--bluegray-500) 30%, transparent); }
.lab-gridov__in span b { position: absolute; top: 8px; left: 6px; font: 500 10px/1 var(--font-display); color: var(--text-tertiary); }
.lab-gridov__in span:nth-child(n+5) { display: none; }
@media (min-width: 768px) { .lab-gridov__in span:nth-child(n+5) { display: block; } .lab-gridov__in span:nth-child(n+9) { display: none; } }
@media (min-width: 1024px) { .lab-gridov__in span:nth-child(n+9) { display: block; } }
.lab-curves { display: flex; flex-direction: column; }
.lab-curves__head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; color: var(--text-tertiary); }
.lab-curves__row { display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--border-hairline); }
.lab-curves__tok { font: 500 12px/1.3 var(--font-display); color: var(--text-tertiary); }
.lab-curves__track { grid-column: 1 / -1; position: relative; height: 12px; }
.lab-curves__track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border-hairline); }
.lab-curves__mark { position: absolute; left: 0; top: 0; width: 12px; height: 12px; background: var(--accent); }
@media (min-width: 768px) { .lab-curves__row { grid-template-columns: 140px 280px 1fr; } .lab-curves__track { grid-column: 3; } }

/* ---------- Reduced motion: everything settles instantly; nothing loops ---------- */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"]) *, :root:not([data-motion="full"]) *::before, :root:not([data-motion="full"]) *::after {
    animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important; }
}
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after {
  animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .lab-marquee__track { width: auto; flex-wrap: wrap; white-space: normal; row-gap: 12px; } :root:not([data-motion="full"]) .lab-marquee__item.is-dup { display: none; } }
:root[data-motion="reduced"] .lab-marquee__track { width: auto; flex-wrap: wrap; white-space: normal; row-gap: 12px; transform: none !important; }
:root[data-motion="reduced"] .lab-marquee__item.is-dup { display: none; }


.lab-demobar { position: fixed; left: 12px; bottom: 12px; z-index: calc(var(--z-cursor) + 1); display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--ink-950); box-shadow: var(--shadow-float); }
.lab-demobar__btn { height: 30px; padding: 0 12px; border: 1px solid var(--navy-700); background: transparent; color: var(--gray-100); font: 500 12px/1 var(--font-display); cursor: pointer; }
.lab-demobar__btn[aria-pressed="true"] { background: var(--gray-100); color: var(--ink-950); }
.lab-demobar__btn:focus-visible { outline-color: var(--silver-200); }
.lab-demo-pad { padding: 24px; }
.lab-demo-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.lab-demo-col { display: flex; flex-direction: column; gap: 20px; }
.lab-demo-brand { background: var(--bg-brand); color: var(--text-on-brand); padding: 24px; }
.lab-demo-note { font: 500 12px/1.4 var(--font-display); letter-spacing: .04em; color: var(--text-tertiary); }
.lab-demo-spacer { height: 70vh; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }


.ml-ch .lab-sh{margin-bottom:56px}
.ml-grid2{display:grid;gap:24px}@media(min-width:1024px){.ml-grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ml-spec{display:grid;grid-template-rows:1fr auto;border:1px solid var(--border-hairline);background:var(--bg-page)}
.ml-spec__demo{padding:32px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.ml-spec__demo .lab-projects{padding:0}
.ml-spec__dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0;padding:20px 24px;border-top:1px solid var(--border-hairline);background:var(--bg-muted)}
.ml-spec__dl>div:first-child{grid-column:1/-1}
.ml-spec__dl dt{font:600 11px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:4px}
.ml-spec__dl dd{margin:0;font-size:13.5px;line-height:1.55;color:var(--text-secondary)}
.ml-spec__dl dd.lab-t-h5{color:var(--text-primary);font-size:20px}
.ml-tables{display:grid;gap:32px;margin-top:56px}@media(min-width:1024px){.ml-tables{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ml-table{width:100%;border-collapse:collapse}
.ml-table caption{text-align:left;color:var(--text-tertiary);padding-bottom:12px}
.ml-table th,.ml-table td{text-align:left;padding:10px 0;border-top:1px solid var(--border-hairline);font-size:14px;font-weight:400;vertical-align:top}
.ml-table td{color:var(--text-secondary);text-align:right}
.ml-bar{padding:12px 16px;border:1px solid var(--border-hairline);font:500 15px/1 var(--font-display);display:flex;gap:12px}
.ml-bar .lab-t-index{color:var(--accent)}
